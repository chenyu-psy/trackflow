name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  branch-sync:
    name: Main/develop sync guard
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.base_ref == 'main' && github.head_ref == 'develop'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check main is already included in develop
        run: |
          git fetch origin main develop
          if ! git merge-base --is-ancestor origin/main origin/develop; then
            echo "origin/main has commits that are not in origin/develop."
            echo "Sync main back into develop before opening a release PR."
            exit 1
          fi

  checks:
    name: Tests, lint, and docs
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --only-group dev --no-install-project

      - name: Run tests
        run: uv run --no-sync pytest

      - name: Run lint checks
        run: uv run --no-sync ruff check src tests

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict
