name: Sync main back to develop

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  sync:
    name: Open sync PR when main advances
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check whether develop already contains main
        id: sync_needed
        run: |
          git fetch origin main develop
          if git merge-base --is-ancestor origin/main origin/develop; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for existing sync PR
        if: steps.sync_needed.outputs.needed == 'true'
        id: existing_pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number="$(gh pr list \
            --base develop \
            --head main \
            --state open \
            --json number \
            --jq '.[0].number // ""')"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Open sync PR
        if: steps.sync_needed.outputs.needed == 'true' && steps.existing_pr.outputs.number == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base develop \
            --head main \
            --title "Sync main back to develop" \
            --body "Main has commits that are not yet in develop. Merge this PR before the next release branch so release PRs do not accumulate avoidable conflicts."
