name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Build and publish GitHub Release
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[release]')
    env:
      PYTHONPATH: src

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync --only-group dev --no-install-project

      - name: Run tests
        run: uv run --no-sync pytest

      - name: Run lint checks
        run: uv run --no-sync ruff check src tests

      - name: Build documentation
        run: uv run --no-sync mkdocs build --strict

      - name: Build package
        run: uv build

      - name: Read package version
        id: version
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from pathlib import Path

          text = Path("pyproject.toml").read_text()
          match = re.search(r'^version\s*=\s*"([^"]+)"', text, flags=re.MULTILINE)
          if match is None:
              raise SystemExit("Could not read project.version from pyproject.toml.")
          version = match.group(1)
          print(f"version={version}")
          print(f"tag=v{version}")
          PY

      - name: Check whether release tag exists
        id: release_tag
        run: |
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/${{ steps.version.outputs.tag }}" >/dev/null; then
            echo "Tag ${{ steps.version.outputs.tag }} already exists."
            echo "Release creation will be skipped."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${{ steps.version.outputs.tag }} does not exist."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read release notes from changelog
        if: steps.release_tag.outputs.exists != 'true'
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          pyproject = Path("pyproject.toml").read_text()
          version_match = re.search(r'^version\s*=\s*"([^"]+)"', pyproject, flags=re.MULTILINE)
          if version_match is None:
              raise SystemExit("Could not read project.version from pyproject.toml.")
          version = version_match.group(1)
          changelog = Path("CHANGELOG.md").read_text()
          pattern = rf"^##[ \t]+{re.escape(version)}(?:[ \t]+-[^\n]*)?\n(?P<body>.*?)(?=^##[ \t]+|\Z)"
          match = re.search(pattern, changelog, flags=re.MULTILINE | re.DOTALL)

          if match is None:
              raise SystemExit(
                  f"CHANGELOG.md does not contain release notes for version {version}."
              )

          notes = match.group("body").strip()
          if not notes:
              raise SystemExit(
                  f"CHANGELOG.md contains an empty release notes section for version {version}."
              )

          Path("release-notes.md").write_text(notes + "\n")
          PY

      - name: Create GitHub Release
        if: steps.release_tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/* \
            --title "trackflow ${{ steps.version.outputs.version }}" \
            --notes-file release-notes.md
