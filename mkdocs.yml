site_name: trackflow
site_description: PsychoPy experiment runtime helpers for behavior, eye tracking, EEG, and deployment workflows.
repo_url: https://github.com/chenyu-psy/trackflow

theme:
  name: material
  palette:
    primary: white
    accent: blue
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.instant
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Introduction: index.md
  - API Reference:
      - Package index: api/index.md
      - Behavior:
          - Overview: api/beh.md
          - Stimuli: api/beh/stimuli.md
          - Screens: api/beh/screens.md
          - Trials: api/beh/trials.md
          - Timeline: api/beh/timeline.md
          - Trial planning: api/beh/design.md
          - Data output: api/beh/data.md
      - Eye tracking: api/gaze.md
      - EEG: api/eeg.md
      - Sync: api/sync.md
  - Articles:
      - articles/index.md
      - PsychoPy-first runtime helpers: articles/psychopy-first.md

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - toc:
      permalink: true
      toc_depth: 3

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - src
          options:
            docstring_style: numpy
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            members_order: source
            filters:
              - "!^_"
