[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trackflow"
version = "0.3.1"
description = "PsychoPy experiment framework helpers for development and deployment-time vendoring."
readme = "README.md"
requires-python = ">=3.10,<3.11"
authors = [
    { name = "Chenyu" }
]
dependencies = [
    "pandas>=2.0.0",
    "scipy>=1.14.1",
    "wxPython>=4.2.5",
    "psychopy>=2024.1.1",
]

[project.scripts]
trackflow = "trackflow.cli:main"

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "pandas>=2.0.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trackflow"]
