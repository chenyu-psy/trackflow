[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trackflow"
version = "0.1.0"
description = "PsychoPy experiment framework helpers for development and deployment-time vendoring."
readme = "README.md"
requires-python = ">=3.8,<3.11"
authors = [
    { name = "Chenyu" }
]
dependencies = [
    "pandas>=2.0.0",
    "psychopy>=2024.1.1",
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.25.0",
    "pandas>=2.0.0",
    "pytest>=8.3.0",
    "ruff>=0.6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trackflow"]
